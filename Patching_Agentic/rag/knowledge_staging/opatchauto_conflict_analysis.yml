id: opatchauto_conflict_analysis
title: "opatchauto -analyze / opatch prereq as the real pre-apply dry-run"
category: opatch
applicable_min_version: "19.0.0.0.0"
applicable_max_version: "19.99.99.99.99"
preconditions:
  - "Patch zip already staged and unzipped on the target host (ansible/roles/oracle_cpu_patch/tasks/stage_patch.yml)."
  - "OPatch itself meets the patch's minimum required OPatch version (checked in precheck.yml)."
steps:
  - "Run 'opatchauto apply <patch_dir> -analyze' (or 'opatch prereq CheckConflictAgainstOHWithDetail' for the manual path) before the real apply."
  - "This is a REAL command against the real Oracle Home's inventory — not an Ansible --check/dry-run. Ansible's own --check mode does not meaningfully validate command/shell-module tasks like this one; they simply don't run under --check."
  - "Treat a conflict-analysis failure the same as any other precheck failure: stop, do not proceed to apply."
validation:
  - "Exit code 0 and no 'Conflicts' section reporting blocking conflicts in the output."
rollback:
  - "N/A — this step makes no changes to the Oracle Home; nothing to roll back."
source: "Oracle OPatch documentation + this project's own ansible/roles/oracle_cpu_patch/tasks/stage_patch.yml, which already implements this. See the Executor build review that flagged conflating this with 'ansible-playbook --check'."
