#   2026-09-15T23:04:48+05:30 — Initial version — base Ansible config (inventory default, roles_path, become settings, SSH pipelining) — Arvind Regukumar
#   2026-09-16T00:24:55+05:30 — Removed "(with Claude Code)" suffix from the author field per project convention — Arvind Regukumar
[defaults]
inventory       = inventories/example_client/hosts.yml
roles_path      = roles
remote_tmp      = ~/.ansible/tmp
local_tmp       = ~/.ansible/tmp
retry_files_enabled = False
timeout         = 30
gathering       = smart

[privilege_escalation]
become        = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
