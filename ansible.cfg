[defaults]
inventory       = inventories/example_client/hosts.yml
roles_path      = roles
remote_tmp      = ~/.ansible/tmp
local_tmp       = ~/.ansible/tmp
retry_files_enabled = False
timeout         = 30
gathering       = smart

[privilege_escalation]
become        = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
