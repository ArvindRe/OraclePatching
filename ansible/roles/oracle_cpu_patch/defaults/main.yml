---
# Changelog:
#   2026-09-15T23:04:48+05:30 — Initial version — full per-patch variable schema — Arvind Regukumar
#   2026-09-16T00:12:11+05:30 — Added audit_log_path default for mandatory audit logging — Arvind Regukumar
#   2026-09-22T21:15:25+05:30 — Added skip_backup_check and backup_max_age_hours defaults for the new backup-verification precheck gate — Arvind Regukumar
#   2026-09-23T00:44:28+05:30 — Added verify_backup_restorable default (off) for the new opt-in RESTORE VALIDATE step — Arvind Regukumar
# Full variable schema for one patch run. Override per-patch in
# vars/patches/<PATCH_ID>.yml and pass with -e @vars/patches/<PATCH_ID>.yml.
#
# oracle_home / grid_home live on the inventory host (see
# inventories/*/hosts.yml) — a patch run only needs to say WHICH patch and
# WHICH CDBs, same separation of concerns as the datapump Ansible project.

patch_id: ""                     # Oracle patch number, e.g. "34765931"
patch_description: ""            # free text, shown in precheck/postcheck output
patch_zip_local_path: ""         # path on the Ansible control node to the downloaded patch zip
patch_staging_dir: /u01/patches  # where the zip is copied + unzipped on the target host

cdbs: []                         # - sid: CDB1
                                  #   pdbs: [PDB1, PDB2]     # pdbs: for postcheck reporting only —
                                                              # datapatch itself covers all open PDBs
                                                              # under a CDB automatically via ORACLE_SID

# Refuses to touch anything (stop services, apply the patch, run datapatch)
# unless this exactly equals patch_id — set via -e confirm_patch=<patch_id>
# at apply time. Never fill this in inside a committed vars file.
confirm_patch: ""

# playbooks/cpu_patch_precheck.yml sets this to false so it always ends in a
# clean, green PLAY RECAP — precheck/stage only, no confirm-gate assertion
# to fail on. playbooks/cpu_patch_apply.yml leaves this at the default true.
run_full_patch: true

# Local, durable audit trail (one JSON object per line) written on the
# Ansible control node — see audit_log.yml and docs/ROADMAP.md phase 5.
# Every invocation of this role writes exactly one entry here, success or
# failure, precheck-only or full apply. Not a substitute for a client's own
# SIEM/change-ticket system where one exists — override per client if so.
audit_log_path: "{{ lookup('env', 'HOME') }}/.oracle_patching/audit.log"

# Backup-verification gate (backup_check.yml) — refuses to proceed without a
# recent RMAN whole-database backup (DB FULL or DB INCR, STATUS=COMPLETED)
# per CDB. Runs unconditionally as part of precheck, same as the free-space
# assert above it. Override only with an explicit -e at invocation time —
# never flip this to true in a committed inventory/vars file, that would
# silently disable the gate for every future run against that host.
skip_backup_check: false
backup_max_age_hours: 24

# Opt-in, stronger check: RESTORE VALIDATE actually proves the backup is
# restorable (reads every backup block), not just that a backup job
# completed. Off by default — real time/I/O cost on every patch run, not a
# cheap metadata check. See backup_check.yml's own comments.
verify_backup_restorable: false

