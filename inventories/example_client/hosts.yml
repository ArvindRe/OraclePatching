# Per-client inventory. For a new client, copy this whole
# inventories/example_client/ directory to inventories/<client_name>/ and
# point at it with `-i inventories/<client_name>/hosts.yml` (or edit
# ansible.cfg's default for single-client use). Keeping one inventory
# folder per client keeps host lists/credentials from bleeding across
# engagements.

all:
  children:
    oracle_db_hosts:
      hosts:
        dbhost1:
          ansible_host: dbhost1.clientdomain.example
          oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1
          grid_home: ""             # set if Grid Infrastructure/ASM/RAC is in use
        dbhost2:
          ansible_host: dbhost2.clientdomain.example
          oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1
          grid_home: ""
