# Vagrant's own SSH key for this VM — get the exact path with:
#   cd test/vagrant && vagrant ssh-config
# if this default doesn't match (it varies slightly by vagrant-qemu version).
ansible_user: vagrant
ansible_ssh_private_key_file: "{{ playbook_dir }}/../test/vagrant/.vagrant/machines/default/qemu/private_key"
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter: /usr/bin/python3

oracle_os_owner: oracle
oracle_os_group: oinstall

min_free_space_gb: 5               # small test disk — real clients use the 20GB default
use_opatchauto: true
