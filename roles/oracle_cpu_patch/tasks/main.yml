---
# Changelog:
#   2026-09-15T23:04:48+05:30 — Initial version — precheck->stage->confirm gate->apply->datapatch->postcheck dispatch — Arvind Regukumar
#   2026-09-16T00:12:11+05:30 — Wrapped sequence in block/rescue/always to make audit logging mandatory on every outcome — Arvind Regukumar
#   2026-09-16T00:24:55+05:30 — Removed "(with Claude Code)" suffix from the author field per project convention — Arvind Regukumar
# Order: precheck -> stage (+ conflict analysis) -> [hard confirm gate] ->
# stop -> apply -> start -> datapatch -> postcheck.
#
# precheck/stage are read-only aside from copying the patch zip to the host
# and unzipping it — safe to run any time, any number of times, via
# playbooks/cpu_patch_precheck.yml.
#
# Everything from the confirm gate onward changes running state (stops a
# listener/instance, applies a binary patch, runs SQL against the
# dictionary) and is refused without an exact confirm_patch match — no
# matter which tags are passed, since the assert task carries the same
# [apply, datapatch] tags as everything it's guarding.
#
# The whole sequence below is wrapped in block/rescue/always so exactly one
# audit log entry (audit_log.yml) is written per invocation — success,
# failure, or precheck-only — regardless of where in the sequence a failure
# happens (including the confirm-gate assert itself, so a rejected apply
# attempt is audit-logged too).

- name: Assert required patch variables are set
  ansible.builtin.assert:
    that:
      - patch_id | length > 0
      - oracle_home | length > 0
      - cdbs | length > 0
    fail_msg: "patch_id, oracle_home, and at least one entry in cdbs are required."
    quiet: true
  tags: [always]

- name: Initialize audit outcome as success (overwritten below on failure)
  ansible.builtin.set_fact:
    _patch_run_outcome: "SUCCESS"
    _patch_run_error: ""
  tags: [always]

- block:
    - name: Precheck
      ansible.builtin.import_tasks: precheck.yml
      tags: [precheck]

    - name: Stage patch and run conflict analysis
      ansible.builtin.import_tasks: stage_patch.yml
      tags: [stage]

    - name: Confirm before making any DB/service state changes
      ansible.builtin.assert:
        that:
          - confirm_patch == patch_id
        fail_msg: >-
          Refusing to apply patch {{ patch_id }} on {{ inventory_hostname }} without explicit confirmation.
          Review the precheck/stage output above, then re-run with -e confirm_patch={{ patch_id }}.
        quiet: true
      tags: [apply, datapatch]
      when: run_full_patch | bool

    - name: Stop services (manual path only — opatchauto handles this itself)
      ansible.builtin.import_tasks: stop_services.yml
      tags: [apply]
      when: run_full_patch | bool and not (use_opatchauto | bool)

    - name: Apply patch
      ansible.builtin.import_tasks: apply_patch.yml
      tags: [apply]
      when: run_full_patch | bool

    - name: Start services (manual path only)
      ansible.builtin.import_tasks: start_services.yml
      tags: [apply]
      when: run_full_patch | bool and not (use_opatchauto | bool)

    - name: Run datapatch
      ansible.builtin.import_tasks: datapatch.yml
      tags: [datapatch]
      when: run_full_patch | bool

    - name: Postcheck
      ansible.builtin.import_tasks: postcheck.yml
      tags: [postcheck]
      when: run_full_patch | bool

  rescue:
    - name: Record failure details for the audit log
      ansible.builtin.set_fact:
        _patch_run_outcome: "FAILED"
        _patch_run_error: >-
          {{ (ansible_failed_result.msg | default(ansible_failed_result.stderr, true))
             | default('see task output above', true) }}

    - name: Re-raise so the play still fails as before
      ansible.builtin.fail:
        msg: "{{ _patch_run_error }}"

  always:
    - name: Write audit log entry
      ansible.builtin.import_tasks: audit_log.yml
      tags: [always]
